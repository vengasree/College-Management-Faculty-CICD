
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faculty-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: faculty-cicd
  template:
    metadata:
      labels:
        app: faculty-cicd
    spec:
      containers:
        - name: faculty-cicd
          image: faculty-cicd:latest
          imagePullPolicy: Never
